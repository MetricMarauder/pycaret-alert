name: Monitor PyCaret 4.0

on:
  schedule:
    # Every day at 12:00 UTC
    # = 8:00 AM Quebec time during daylight saving time
    - cron: "0 12 * * *"

  # Allows you to run the workflow manually
  workflow_dispatch:

jobs:
  check-pycaret:
    runs-on: ubuntu-latest

    steps:
      - name: Check PyPI for PyCaret 4.0.0
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          VERSION=$(python - <<'PY'
          import json
          import urllib.request

          url = "https://pypi.org/pypi/pycaret/json"

          with urllib.request.urlopen(url) as response:
              data = json.load(response)

          if "4.0.0" in data["releases"]:
              print("released")
          else:
              print("not_released")
          PY
          )

          if [ "$VERSION" = "released" ]; then

            curl \
              -H "Title: 🚀 PyCaret 4.0.0 is LIVE!" \
              -H "Priority: urgent" \
              -H "Tags: rocket,partying_face" \
              -d "PyCaret 4.0.0 has officially been released on PyPI!" \
              "https://ntfy.sh/$NTFY_TOPIC"

          else

            curl \
              -H "Title: 📦 PyCaret 4.0 update" \
              -H "Priority: default" \
              -H "Tags: package" \
              -d "PyCaret 4.0.0 has NOT been released yet. I'll check again tomorrow." \
              "https://ntfy.sh/$NTFY_TOPIC"

          fi
