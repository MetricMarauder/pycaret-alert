name: Check PyCaret 4.0

on:
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check PyPI
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          VERSION=$(python - <<'PY'
          import json
          import urllib.request

          url = "https://pypi.org/pypi/pycaret/json"

          with urllib.request.urlopen(url) as response:
              data = json.load(response)

          print("yes" if "4.0.0" in data["releases"] else "no")
          PY
          )

          if [ "$VERSION" = "yes" ]; then
            curl \
              -H "Title: 🚀 PyCaret 4.0.0 is LIVE!" \
              -H "Priority: urgent" \
              -H "Tags: rocket" \
              -d "PyCaret 4.0.0 has been released!" \
              "https://ntfy.sh/$NTFY_TOPIC"
          else
            echo "PyCaret 4.0.0 is not released yet."
          fi
